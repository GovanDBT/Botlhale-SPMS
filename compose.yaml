name: Botlhale Project

services:
  nextjs-app:
    build:
      context: .
    container_name: nextjs_app
    restart: always
    ports:
      - 3000:3000  # For Next.js
      - 5555:5555  # For Prisma Studio
    env_file:
      - .env
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  build:

